name: Weekly build
on:
  schedule:
    - cron: "40 13 * * 2,3,5"   # after the PL X-ray build on Tuesday, Wednesday and Friday
    - cron: "25 */2 * * 0,1,6"  # every two hours over the weekend and on Monday: fresh results from ESPN
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The PL X-ray repository, read only: its data files and model code. Nothing is written back.
      - uses: actions/checkout@v4
        with:
          repository: czakopeti/soccer_stats
          path: upstream
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Player data for the FPL helper, read only.
      - uses: actions/checkout@v4
        with:
          repository: oladeeayo/pl-catalogue
          path: catalogue
      - run: pip install -r upstream/requirements.txt
      - run: python scripts/build.py upstream site catalogue
      - name: Keep the model's pre-kickoff picks for the prediction game
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/model_picks.json
          if ! git diff --cached --quiet; then git commit -m "Model picks" && git pull --rebase && git push; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
