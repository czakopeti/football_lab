name: Weekly build
on:
  schedule:
    - cron: "40 13 * * 2,3,5"   # after the PL X-ray build on Tuesday, Wednesday and Friday
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The PL X-ray repository, read only: its data files and model code. Nothing is written back.
      - uses: actions/checkout@v4
        with:
          repository: czakopeti/soccer_stats
          path: upstream
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r upstream/requirements.txt
      - run: python scripts/build.py upstream site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
